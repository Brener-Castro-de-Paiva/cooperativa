
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Painel Administrativo | COJURIS</title>

    <link rel="stylesheet" href="./css/portal.css">
</head>

<body class="admin-page">

    <main class="admin-container">

        <header class="admin-header">

            <div>
                <p class="admin-subtitle">COJURIS</p>

                <h1>Painel Administrativo</h1>

                <p>
                    Gestão das manifestações de interesse
                    dos futuros cooperados.
                </p>
            </div>

            
            <!-- NAVEGAÇÃO DO ADMINISTRADOR -->

            <div class="admin-navegacao">

                <a
                    href="./painel.html"
                    class="btn-area-cooperado">

                    <span aria-hidden="true">◉</span>
                    Área do Cooperado

                </a>

                <button
                    id="admin-sair"
                    type="button"
                    class="btn-form"
                    disabled>

                    Encerrar sessão

                </button>

            </div>


        </header>

        <section
            class="admin-section"
            aria-labelledby="solicitacoes-titulo">

            <h2 id="solicitacoes-titulo">
                Solicitações de ingresso
            </h2>

            <p
                id="admin-mensagem"
                role="status"
                aria-live="polite">
                Verificando permissões...
            </p>

                            
            <div class="admin-ferramentas">

                <button
                    type="button"
                    id="btn-limpar-tela"
                    class="btn-limpar-tela">

                    Limpar tela

                </button>

                <button
                    type="button"
                    id="btn-recarregar-lista"
                    class="btn-recarregar-lista">

                    Atualizar lista

                </button>

            </div>

            <div
                id="lista-interessados"
                class="admin-lista">
            </div>

        </section>

    </main>

    <script
        type="module"
        src="./js/admin.js">
    </script>

</body>
</html>
